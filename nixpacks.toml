# Railway / Nixpacks build configuration.
# The viewer is a pure static site; install dependencies with pnpm and run `serve`.

[phases.setup]
nixPkgs = ["nodejs_20"]

# corepack bundled with nodejs_20 is too old to launch pnpm 11's ESM shim
# (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING), so upgrade it before enabling.
[phases.install]
cmds = [
  "npm install -g corepack@latest",
  "corepack enable",
  "pnpm install --prod --frozen-lockfile",
]

[start]
cmd = "pnpm start"
