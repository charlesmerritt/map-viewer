# Railway / Nixpacks build configuration.
# The Node server serves static assets and range-addressable temporary COG uploads.

# pnpm 11.2.2 requires Node >= 22.13 (uses node:sqlite), so build on Node 22.
[phases.setup]
nixPkgs = ["nodejs_22"]

# Older corepack releases cannot launch pnpm 11's ESM shim
# (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING), so upgrade it before enabling.
[phases.install]
cmds = [
  "npm install -g corepack@latest",
  "corepack enable",
  "pnpm install --prod --frozen-lockfile",
]

[start]
cmd = "pnpm start"
